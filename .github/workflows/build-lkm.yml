name: Build LKM for KernelSU
on:
  workflow_call:
    inputs:
      package_name:
        description: 'package name of manager'
        required: false
        default: 'yhaxhr.birgvn.bmwbne'
        type: string
      expected_size:
        description: 'expected signature size'
        required: false
        default: '998'
        type: string
      expected_hash:
        description: 'expected signature hash'
        required: false
        default: '79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7'
        type: string
  workflow_dispatch:
    inputs:
      package_name:
        description: 'package name of manager'
        required: false
        default: 'yhaxhr.birgvn.bmwbne'
        type: string
      expected_size:
        description: 'expected signature size'
        required: false
        default: '998'
        type: string
      expected_hash:
        description: 'expected signature hash'
        required: false
        default: '79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7'
        type: string
jobs:
  build-lkm:
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: ${{ matrix.kmi }}
      package_name: ${{ inputs.package_name || 'yhaxhr.birgvn.bmwbne' }}
      expected_size: ${{ inputs.expected_size || '998' }}
      expected_hash: ${{ inputs.expected_hash || '79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7' }}
      
